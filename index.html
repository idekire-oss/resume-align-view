<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; font-src 'none'; connect-src 'none'; frame-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Resume view</title>
  <link rel="stylesheet" href="app.css?v=3" />
</head>
<body>
  <p id="note" class="note">
    Display only. No generate, no Ollama, no upload to a server. Open a view file or PDF (max 10 MB), or use a link from Resume Align on your PC.
  </p>
  <p id="error" class="error" hidden></p>
  <div id="empty" class="empty">
    <label class="file">
      Open .view.json or PDF
      <input id="file" type="file" />
    </label>
  </div>
  <article id="sheet" class="sheet" hidden></article>
  <script src="catalog.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
